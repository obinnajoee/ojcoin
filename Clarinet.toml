[project]
name = 'ojcoin'
description = 'OJCoin - A SIP-010 compliant fungible token on Stacks'
authors = []
telemetry = false
cache_dir = './.cache'
requirements = []
[contracts.ojcoin]
path = 'contracts/ojcoin.clar'
clarity_version = 4
epoch = 'latest'
[repl.analysis]
passes = ['check_checker']

[repl.analysis.lints]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
